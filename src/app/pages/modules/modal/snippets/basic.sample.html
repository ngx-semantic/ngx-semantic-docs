<button type="button" sui-button (click)="isBasicModalVisible = true">Show Modal</button>

<sui-modal
  suiBasic
  suiHeaderIcon="archive"
  suiHeaderText="Archive Old Messages"
  [(visible)]="isBasicModalVisible">
  <div suiModalContent>
    <p>Your inbox is getting full, would you like us to enable automatic archiving of old messages?</p>
  </div>
  <div suiModalActions>
    <button type="button" sui-button suiBasic suiInverted suiColour="red" (click)="isBasicModalVisible = false">
      <i sui-icon suiIconType="remove"></i>
      No
    </button>
    <button type="button" sui-button suiInverted suiColour="green" (click)="isBasicModalVisible = false">
      <i sui-icon suiIconType="checkmark"></i>
      Yes
    </button>
  </div>
</sui-modal>
