<button type="button" sui-button (click)="isStandardModalVisible = true">Show Modal</button>

<sui-modal
    suiHeaderText="Select a Photo"
    [(visible)]="isStandardModalVisible">
    <div suiModalContent suiImage>
      <div sui-image suiSize="medium">
        <img src="assets/images/laura.jpg" alt="Profile photo">
      </div>
      <div suiModalDescription>
        <div sui-header>We've auto-chosen a profile image for you.</div>
        <p>We've grabbed the following image from the <a href="https://www.gravatar.com"
        target="_blank">gravatar</a> image
      associated with your registered e-mail address.</p>
      <p>Is it okay to use this photo?</p>
    </div>
  </div>
  <div suiModalActions>
    <button type="button" sui-button suiEmphasis="secondary" suiColour="black" (click)="isStandardModalVisible = false">
      Nope
    </button>
    <button type="button" sui-button suiEmphasis="positive" suiIcon suiLabeled="right labeled" (click)="isStandardModalVisible = false">
      Yep, that's me
      <i sui-icon suiIconType="checkmark"></i>
    </button>
  </div>
</sui-modal>
