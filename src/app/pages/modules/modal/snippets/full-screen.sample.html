<button type="button" sui-button (click)="isFullScreenModalVisible = true">Show Modal</button>

<sui-modal
  suiFullScreen
  suiHeaderText="Update Your Settings"
  [(visible)]="isFullScreenModalVisible">
  <div suiModalContent>
    <div sui-form>
      <h4 sui-header suiDividing>Give us your feedback</h4>
      <div suiFormField>
        <label>Feedback</label>
        <textarea></textarea>
      </div>
      <div suiFormField>
        <sui-checkbox [checked]="true">It's okay to contact me.</sui-checkbox>
      </div>
    </div>
  </div>
  <div suiModalActions>
    <button type="button" sui-button (click)="isFullScreenModalVisible = false">
      Cancel
    </button>
    <button type="button" sui-button suiEmphasis="positive" (click)="isFullScreenModalVisible = false">
      Send
    </button>
  </div>
</sui-modal>
