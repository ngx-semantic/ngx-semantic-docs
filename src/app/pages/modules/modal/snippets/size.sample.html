<button type="button" sui-button (click)="isSizeModalVisible = true">Show Modal</button>

<sui-modal
  suiSize="mini"
  suiHeaderText="Delete Your Account"
  [(visible)]="isSizeModalVisible">
  <div suiModalContent>
    <p>Are you sure you want to delete your account</p>
  </div>
  <div suiModalActions>
    <button type="button" sui-button suiColour="red" (click)="isSizeModalVisible = false">
      No
    </button>
    <button type="button" sui-button suiIcon suiLabeled="right labeled" suiEmphasis="positive" (click)="isSizeModalVisible = false">
      Yes
      <i sui-icon suiIconType="checkmark"></i>
    </button>
  </div>
</sui-modal>
