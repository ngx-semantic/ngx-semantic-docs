<div sui-steps
     suiWidth="three">
  <div sui-step>
    <i sui-icon
       suiIconType="truck"></i>
    <div suiStepContent>
      <div suiStepTitle>Shipping</div>
    </div>
  </div>
  <div sui-step
       suiActive>
    <i sui-icon
       suiIconType="payment"></i>
    <div suiStepContent>
      <div suiStepTitle>Billing</div>
    </div>
  </div>
  <div sui-step
       disabled>
    <i sui-icon
       suiIconType="info"></i>
    <div suiStepContent>
      <div suiStepTitle>Confirm Order</div>
    </div>
  </div>
</div>
