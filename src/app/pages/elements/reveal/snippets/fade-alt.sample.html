<div sui-image
     sui-reveal
     suiFade
     suiSize="small">
  <div suiRevealContent
       suiVisible="visible">
    <img sui-image
         src="https://semantic-ui.com/images/wireframe/square-image.png"/>
  </div>
  <div suiRevealContent
       suiVisible="hidden">
    <img sui-image
         src="https://semantic-ui.com/images/avatar/large/ade.jpg"/>
  </div>
</div>
