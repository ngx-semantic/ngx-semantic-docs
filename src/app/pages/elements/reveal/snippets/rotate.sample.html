<div sui-image
     suiCircular
     suiSize="small"
     sui-reveal
     suiRotate="right">
  <div suiRevealContent
       suiVisible="visible">
    <img sui-image
         src="https://semantic-ui.com/images/wireframe/square-image.png"/>
  </div>
  <div suiRevealContent
       suiVisible="hidden">
    <img sui-image
         src="https://semantic-ui.com/images/avatar/large/stevie.jpg"/>
  </div>
</div>
