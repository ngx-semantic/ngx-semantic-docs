<div sui-segment
     suiBasic
     suiTextAlignment="center aligned">
  <div sui-input
       suiIcon="left icon"
       suiAction="action">
    <i sui-icon
       suiIconType="search"></i>
    <input type="text" placeholder="Order #">
    <div sui-button class="submit"
         suiColour="blue">
      Search
    </div>
  </div>
  <div sui-divider
       suiDirection="horizontal">
    or
  </div>
  <div sui-button
       suiIcon
       suiColour="teal"
       suiLabeled="labeled">
    Create New Order
    <i sui-icon
       suiIconType="add"></i>
  </div>
</div>
