<div sui-segment
     suiPlaceholder>
  <div sui-grid
       suiStackable
       suiWidth="two"
       suiRelaxation="very relaxed">
    <div suiGridColumn>
      <div sui-form>
        <div suiFormField>
          <label>Username</label>
          <div sui-input
               suiIcon="left icon">
            <input type="text" placeholder="Username">
            <i sui-icon
               suiIconType="user"></i>
          </div>
        </div>
        <div suiFormField>
          <label>Password</label>
          <div sui-input
               suiIcon="left icon">
            <input type="password">
            <i sui-icon
               suiIconType="lock"></i>
          </div>
        </div>
        <div sui-button
             class="submit"
             suiColour="blue">
          Login
        </div>
      </div>
    </div>
    <div suiGridColumn
         suiAlignment="middle aligned">
      <div sui-button
           suiSize="big">
        <i sui-icon
           suiIconType="signup"></i>
        Sign Up
      </div>
    </div>
  </div>
  <div sui-divider
       suiDirection="vertical">
    or
  </div>
</div>
