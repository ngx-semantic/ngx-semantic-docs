<div sui-menu
     suiTabular
     suiAttached="top">
  <a suiMenuItem
     [suiActive]="activeItem === 'bio'"
     (click)="select('bio')">
    Bio
  </a>
  <a suiMenuItem
     [suiActive]="activeItem === 'photos'"
     (click)="select('photos')">
    Photos
  </a>
  <div suiSubMenu
       suiRight>
    <div suiMenuItem>
      <div sui-input
           suiIcon="icon"
           suiTransparent>
        <input type="text" placeholder="Search users...">
        <i sui-icon suiIconType="search link"></i>
      </div>
    </div>
  </div>
</div>
<div sui-segment
     suiAttached="bottom attached">
  <doc-wireframe type="paragraph"></doc-wireframe>
</div>
