<div sui-menu
     suiPointing>
  <a suiMenuItem
     [suiActive]="activeItem === 'home'"
     (click)="select('home')">
    Home
  </a>
  <a suiMenuItem
     [suiActive]="activeItem === 'messages'"
     (click)="select('messages')">
    Messages
  </a>
  <a suiMenuItem
     [suiActive]="activeItem === 'friends'"
     (click)="select('friends')">
    Friends
  </a>
  <div suiSubMenu
       suiRight>
    <div suiMenuItem>
      <div sui-input
           suiIcon="icon"
           suiTransparent>
        <input type="text" placeholder="Search...">
        <i sui-icon suiIconType="search link"></i>
      </div>
    </div>
  </div>
</div>
<div sui-segment>
  <doc-wireframe type="paragraph"></doc-wireframe>
</div>
